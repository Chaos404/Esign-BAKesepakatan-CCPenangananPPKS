<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b52">
  <meta http-equiv="refresh" content="2;url=https://script.google.com/macros/s/AKfycbzufMXxDqvGYTYJWgne9jy9bWOiMIgykgfX36kLLc1qkoJMiQsCB2IPKVV8OgUmw4D7/exec">
  <title>Mengalihkan — E-Sign Berita Acara CC Internal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033; background: linear-gradient(145deg, #eef3fa 0%, #f8fafc 55%, #e8eef7 100%);
    }
    .card {
      width: min(100%, 420px); padding: 38px 28px; text-align: center;
      background: rgba(255,255,255,.94); border: 1px solid #dce4ef;
      border-radius: 24px; box-shadow: 0 22px 60px rgba(25, 49, 83, .12);
    }
    .mark {
      width: 58px; height: 58px; margin: 0 auto 20px; display: grid; place-items: center;
      color: white; background: #174ea6; border-radius: 18px;
      font-size: 25px; font-weight: 800; letter-spacing: -1px;
    }
    .eyebrow { color: #547092; font-size: 11px; font-weight: 800; letter-spacing: 1.7px; }
    h1 { margin: 9px 0 8px; font-size: 21px; line-height: 1.3; }
    p { margin: 0; color: #66758a; font-size: 13px; line-height: 1.6; }
    .loader {
      width: 42px; height: 42px; margin: 27px auto 16px; border-radius: 50%;
      border: 4px solid #e4ebf4; border-top-color: #174ea6;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .small { margin-top: 24px; font-size: 11px; color: #98a4b5; }
    a { color: #174ea6; font-weight: 700; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
  </style>
  <script>
    window.addEventListener("load", function () {
      window.setTimeout(function () {
        window.location.replace("https://script.google.com/macros/s/AKfycbzufMXxDqvGYTYJWgne9jy9bWOiMIgykgfX36kLLc1qkoJMiQsCB2IPKVV8OgUmw4D7/exec");
      }, 1400);
    });
  </script>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="mark">CC</div>
    <div class="eyebrow">E-SIGN • DOKUMEN INTERNAL</div>
    <h1>Berita Acara Kesepakatan</h1>
    <p>Pembahasan Kasus (CC) Internal<br>Mengenai Tindak Lanjut Penanganan PPKS</p>
    <div class="loader" role="status" aria-label="Memuat"></div>
    <p>Mohon tunggu, Anda sedang diarahkan ke halaman tanda tangan.</p>
    <div class="small">Jika halaman tidak terbuka otomatis,<br><a href="https://script.google.com/macros/s/AKfycbzufMXxDqvGYTYJWgne9jy9bWOiMIgykgfX36kLLc1qkoJMiQsCB2IPKVV8OgUmw4D7/exec">klik di sini untuk melanjutkan</a>.</div>
  </main>
</body>
</html>
